<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafia Night</title>
<style>
:root{--bg:#07070b;--card:#11111a;--card2:#191924;--line:#292936;--red:#d61f45;--purple:#7448ff;--gold:#f0b84b;--text:#f7f7fb;--muted:#a5a5b4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#24132a 0,#0b0a10 35%,#050507 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-weight:900;letter-spacing:1px}.pill{background:#171722;border:1px solid var(--line);border-radius:99px;padding:7px 11px;color:var(--muted);font-size:12px}.card{background:linear-gradient(145deg,#15151f,#0f0f17);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 18px 70px #0009}.hero{text-align:center;padding:42px 20px}.eyebrow{color:#d7caff;font-size:12px;letter-spacing:3px;text-transform:uppercase}.title{font-size:44px;line-height:1;margin:12px 0;font-weight:950}.sub{color:var(--muted);line-height:1.7}.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1}input,select{width:100%;background:#0c0c13;border:1px solid #353544;color:#fff;border-radius:14px;padding:13px;font:inherit;outline:none}button{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#8359ff,#6336e8);cursor:pointer;transition:.15s}button:active{transform:scale(.98)}button.secondary{background:#242431}button.red{background:linear-gradient(135deg,#e22d50,#a81435)}button.gold{background:linear-gradient(135deg,#e8bd5c,#b67b1d);color:#18120a}button:disabled{opacity:.4}.section{margin-top:18px}.players{display:grid;gap:8px;margin:12px 0}.player{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:14px}.num{color:#777789;width:28px}.name{flex:1}.x{background:#2a1520;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{min-height:62px;background:#1a1a26;border:1px solid #343444;text-align:right}.choice:hover{border-color:#7658d9}.center{text-align:center}.icon{font-size:58px}.big{font-size:30px;font-weight:950;margin:10px 0}.rolebox{padding:25px;border:1px solid #3c315f;background:radial-gradient(circle at 50% 0,#2b1b4d,#13131c 65%);border-radius:22px;margin:18px 0}.role{font-size:42px;font-weight:950}.timer{font-size:54px;font-weight:950;font-variant-numeric:tabular-nums;margin:12px}.phase{display:inline-block;padding:7px 12px;border-radius:99px;background:#241b3d;color:#d9ccff}.notice{padding:14px;border-radius:15px;background:#1c1827;border:1px solid #3b3150;margin:12px 0;line-height:1.7}.hidden{display:none}.muted{color:var(--muted)}.small{font-size:12px}.bar{height:7px;background:#242430;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--purple),#c45cff);width:100%;transition:width 1s linear}.alive{color:#7ee2a5}.dead{color:#e96c7f;text-decoration:line-through}.winner{font-size:40px;font-weight:950;color:#f3c75f;margin:20px 0}.footer{text-align:center;color:#666676;font-size:11px;padding:15px}
@media(max-width:500px){.title{font-size:36px}.grid{grid-template-columns:1fr}.card{padding:18px}}
</style></head>
<body><div class="wrap"><div class="top"><div class="logo">🎭 MAFIA NIGHT</div><div id="status" class="pill">جاهز</div></div><div id="app"></div><div class="footer">لعبة محلية — مرّر الجهاز بين اللاعبين</div></div>
<script>
const $=x=>document.getElementById(x), app=$("app");
const R={mafia:["🔪","مافيا","تعملون معاً سراً للقضاء على المواطنين."],doctor:["🩺","دكتور","كل ليلة احمِ لاعباً واحداً من القتل."],detective:["🔎","محقق","كل ليلة افحص لاعباً لمعرفة هل هو مافيا."],citizen:["👤","مواطن","اكتشف المافيا بالتحقيق والنقاش والتصويت."]};
let G={screen:"home",players:[],roles:[],alive:[],phase:"",turn:0,night:{kill:null,save:null,check:null},timer:0,interval:null,settings:{night:45,day:90}};
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setStatus(t){$("status").textContent=t}
function home(){G.screen="home";setStatus("الإعداد");render()}
function render(){clearInterval(G.interval); if(G.screen==="home")homeUI();else if(G.screen==="roles")rolesUI();else if(G.screen==="night")nightUI();else if(G.screen==="day")dayUI();else endUI()}
function homeUI(){app.innerHTML=`<div class="card"><div class="hero"><div class="eyebrow">THE CLASSIC SOCIAL DEDUCTION</div><div class="title">MAFIA<br>NIGHT</div><p class="sub">لعبة مافيا مصممة لكم وللشباب. جهاز واحد يكفي — كل لاعب يستلم الجهاز ويشوف دوره بسرية.</p></div><div class="section"><div class="row"><div class="grow"><input id="n" placeholder="اكتب اسم اللاعب"></div><button onclick="add()">إضافة</button></div><div class="players" id="pl"></div></div><div class="section"><div class="row"><div class="grow"><select id="night"><option value="45">الليل: 45 ثانية</option><option value="60">الليل: 60 ثانية</option><option value="90">الليل: 90 ثانية</option></select></div><div class="grow"><select id="day"><option value="90">النقاش: 90 ثانية</option><option value="120">النقاش: دقيقتان</option><option value="180">النقاش: 3 دقائق</option></select></div></div></div><div class="section"><button style="width:100%" onclick="start()" ${G.players.length<4?"disabled":""}>ابدأ اللعبة • ${G.players.length} لاعبين</button><div class="notice small">التوزيع: مافيا بنسبة تقريبية 1 لكل 4 لاعبين. من 6 لاعبين فأكثر: دكتور + محقق.</div></div></div>`;drawPlayers()}
function drawPlayers(){let p=$("pl");p.innerHTML=G.players.map((x,i)=>`<div class="player"><span class="num">${i+1}</span><span class="name">${esc(x)}</span><button class="x" onclick="removeP(${i})">×</button></div>`).join("")}
function add(){let v=$("n").value.trim();if(v&&G.players.length<20){G.players.push(v);render();setTimeout(()=>$("n")?.focus(),0)}}
function removeP(i){G.players.splice(i,1);render()}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function makeRoles(n){let a=[];let m=Math.max(1,Math.floor(n/4));for(let i=0;i<m;i++)a.push("mafia");if(n>=6)a.push("doctor","detective");while(a.length<n)a.push("citizen");return shuffle(a)}
function start(){G.settings.night=+$("night").value;G.settings.day=+$("day").value;G.roles=makeRoles(G.players.length);G.alive=G.players.map((_,i)=>i);G.screen="roles";G.turn=0;render()}
function rolesUI(){let i=G.turn,r=G.roles[i],x=R[r];app.innerHTML=`<div class="card center"><span class="phase">توزيع الأدوار • ${i+1}/${G.players.length}</span><h2>🔒 دور سري</h2><p class="muted">سلّم الجهاز إلى <b>${esc(G.players[i])}</b> فقط</p><div class="rolebox"><div class="icon">🎭</div><p>اضغط لإظهار دورك</p><button onclick="reveal()">إظهار الدور</button></div><p class="small muted">لا تخلي أي لاعب ثاني يشوف الشاشة.</p></div>`;setStatus("توزيع الأدوار")}
function reveal(){let i=G.turn,r=G.roles[i],x=R[r],mafia=G.roles.map((v,j)=>v==="mafia"?G.players[j]:null).filter(Boolean);app.innerHTML=`<div class="card center"><p class="muted">${esc(G.players[i])}</p><div class="rolebox"><div class="icon">${x[0]}</div><div class="role">${x[1]}</div><p>${x[2]}</p>${r==="mafia"?`<div class="notice"><b>زملاؤك في المافيا:</b><br>${mafia.map(esc).join(" • ")}</div>`:""}</div><button onclick="nextRole()">${i<G.players.length-1?"إخفاء الدور • التالي":"إخفاء الدور • ابدأ اللعبة"}</button></div>`}
function nextRole(){G.turn++;if(G.turn<G.players.length)render();else beginNight()}
function beginNight(){G.screen="night";G.night={kill:null,save:null,check:null};startTimer(G.settings.night);render()}
function alive(exclude=-1){return G.alive.filter(i=>i!==exclude)}
function buttons(list,fn){return `<div class="grid">${list.map(i=>`<button class="choice" onclick="${fn}(${i})">${esc(G.players[i])}</button>`).join("")}</div>`}
function timerHTML(){return `<div class="timer" id="tm">${fmt(G.timer)}</div><div class="bar"><div id="fill" class="fill"></div></div>`}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTimer(n){G.timer=n;clearInterval(G.interval);G.interval=setInterval(()=>{G.timer--;updateTimer();if(G.timer<=0){clearInterval(G.interval);if(G.phase==="night")autoNight();else autoDay()}},1000)}
function updateTimer(){let e=$("tm"),f=$("fill");if(e)e.textContent=fmt(Math.max(0,G.timer));if(f)f.style.width=Math.max(0,G.timer/(G.phase==="night"?G.settings.night:G.settings.day)*100)+"%"}
function nightUI(){G.phase="night";let ma=G.alive.filter(i=>G.roles[i]==="mafia"),doc=G.alive.find(i=>G.roles[i]==="doctor"),det=G.alive.find(i=>G.roles[i]==="detective");let step=G.night.step||"mafia";let body="";
if(step==="mafia")body=`<h2>🔪 المافيا — اختاروا الضحية</h2><p class="muted">سلّم الجهاز للمافيا. اختاروا لاعباً واحداً.</p>${buttons(alive().filter(i=>G.roles[i]!=="mafia"),"kill")}`;
else if(step==="doctor")body=doc!==undefined?`<h2>🩺 الدكتور</h2><p class="muted">احمِ لاعباً واحداً الليلة.</p>${buttons(G.alive,"save")}`:nextNightStep();
else if(step==="detective")body=det!==undefined?`<h2>🔎 المحقق</h2><p class="muted">افحص لاعباً واحداً.</p>${buttons(G.alive.filter(i=>i!==det),"check")}`:finishNight();
else body=`<h2>🌙 انتهى الليل</h2><p>جاري الانتقال...</p>`;
app.innerHTML=`<div class="card"><div class="center"><span class="phase">🌙 الليل</span>${timerHTML()}</div>${body}</div>`;updateTimer()}
function kill(i){G.night.kill=i;G.night.step="doctor";render()}
function save(i){G.night.save=i;G.night.step="detective";render()}
function check(i){G.night.check=i;let yes=G.roles[i]==="mafia";clearInterval(G.interval);app.innerHTML=`<div class="card center"><div class="icon">🔎</div><h2>نتيجة التحقيق</h2><div class="big">${esc(G.players[i])}</div><div class="notice">${yes?"🔪 هذا اللاعب مافيا":"👤 هذا اللاعب ليس مافيا"}</div><button onclick="finishNight()">إخفاء النتيجة</button></div>`}
function nextNightStep(){G.night.step="detective";return ""}
function finishNight(){clearInterval(G.interval);if(G.night.kill!==null&&G.night.kill!==G.night.save)G.alive=G.alive.filter(i=>i!==G.night.kill);if(checkWin())return;G.screen="day";startTimer(G.settings.day);render()}
function autoNight(){if(G.night.step==="mafia"){let opts=alive().filter(i=>G.roles[i]!=="mafia");kill(opts[Math.floor(Math.random()*opts.length)])}else if(G.night.step==="doctor"){let d=G.alive.find(i=>G.roles[i]==="doctor");if(d!==undefined)save(G.alive[Math.floor(Math.random()*G.alive.length)]);else{G.night.step="detective";render()}}else if(G.night.step==="detective"){finishNight()}}
function dayUI(){G.phase="day";let dead=G.players.map((x,i)=>!G.alive.includes(i)?x:null).filter(Boolean);app.innerHTML=`<div class="card"><div class="center"><span class="phase">☀️ النهار</span>${timerHTML()}</div><h2>ناقشوا… ثم صوّتوا 🗳️</h2><p class="muted">عند انتهاء النقاش، اختاروا لاعباً واحداً لإخراجه.</p>${dead.length?`<div class="notice">💀 خرجوا: ${dead.map(esc).join(" • ")}</div>`:""}<h3>اللاعبون الأحياء</h3>${buttons(G.alive,"vote")}</div>`;updateTimer()}
function vote(i){clearInterval(G.interval);G.alive=G.alive.filter(x=>x!==i);if(checkWin())return;app.innerHTML=`<div class="card center"><div class="icon">🗳️</div><h2>تم التصويت</h2><div class="big">${esc(G.players[i])}</div><p class="muted">خرج من اللعبة.</p><button onclick="beginNight()">🌙 ابدأ الليل التالي</button></div>`}
function autoDay(){let i=G.alive[Math.floor(Math.random()*G.alive.length)];vote(i)}
function checkWin(){let m=G.alive.filter(i=>G.roles[i]==="mafia").length,c=G.alive.length-m;if(m===0){G.winner="المواطنون";G.screen="end";render();return true}if(m>=c){G.winner="المافيا";G.screen="end";render();return true}return false}
function endUI(){setStatus("انتهت اللعبة");let rows=G.players.map((p,i)=>`<div class="player"><span>${esc(p)}</span><span>${R[G.roles[i]][0]} ${R[G.roles[i]][1]}</span></div>`).join("");app.innerHTML=`<div class="card center"><div class="icon">🏆</div><h1>الفائزون</h1><div class="winner">${G.winner}</div><div class="players">${rows}</div><div class="row"><button class="grow" onclick="newGame()">لعبة جديدة</button><button class="secondary grow" onclick="home()">تغيير اللاعبين</button></div></div>`}
function newGame(){G.roles=makeRoles(G.players.length);G.alive=G.players.map((_,i)=>i);G.screen="roles";G.turn=0;render()}
homeUI();
</script></body></html>
